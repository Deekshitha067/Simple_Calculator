<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Calculator</title>
<style>
  /* 🌈 Background setup */
  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #3f524e, #9face6);
    font-family: 'Poppins', sans-serif;
  }

  /* 💎 Glass container */
  .calculator {
    background: rgba(89, 24, 119, 0.15);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(7, 139, 29, 0.507);
    padding: 20px;
    width: 280px;
  }

  /* 🖥 Display styling */
  #display {
    width: 100%;
    height: 60px;
    border: none;
    border-radius: 10px;
    font-size: 1.8rem;
    text-align: right;
    padding: 10px;
    margin-bottom: 15px;
    background: rgba(255, 255, 255, 0.25);
    color: #fff;
    box-shadow: inset 0 0 5px rgba(255,255,255,0.2);
  }

  /* 🔘 Button grid */
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    height: 60px;
    font-size: 1.3rem;
    border: none;
    border-radius: 12px;
    color: white;
    background: rgba(128, 1, 1, 0.603);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  button:hover {
    background: rgba(145, 202, 10, 0.781);
    transform: translateY(-3px);
  }

  /* 🔹 Special colors */
  .operator { background: rgba(255, 180, 0, 0.4); }
  .equal { background: rgba(6, 173, 173, 0.705); }
  .clear { background: rgba(184, 12, 78, 0.568); }
</style>
</head>
<body>

<div class="calculator">
  <input type="text" id="display" readonly>

  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="operator" onclick="appendOperation('/')">/</button>
    <button class="operator" onclick="appendOperation('*')">*</button>
    <button class="operator" onclick="appendOperation('-')">-</button>

    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button class="operator" onclick="appendOperation('+')">+</button>

    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button class="equal" onclick="calculate()">=</button>

    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button onclick="appendNumber('0')">0</button>
  </div>
</div>

<script>
  let currentInput = '';
  let currentOperation = '';
  let previousInput = '';

  function appendNumber(number) {
    currentInput += number;
    document.getElementById('display').value = `${previousInput} ${currentOperation} ${currentInput}`;
  }

  function appendOperation(operation) {
    if (currentInput === '') return;
    if (previousInput !== '') calculate();
    currentOperation = operation;
    previousInput = currentInput;
    currentInput = '';
    document.getElementById('display').value = `${previousInput} ${currentOperation}`;
  }

  function calculate() {
    if (previousInput === '' || currentInput === '') return;
    let result = eval(`${previousInput}${currentOperation}${currentInput}`);
    document.getElementById('display').value = result;
    previousInput = result;
    currentInput = '';
    currentOperation = '';
  }

  function clearDisplay() {
    currentInput = '';
    previousInput = '';
    currentOperation = '';
    document.getElementById('display').value = '';
  }
</script>

</body>
</html>
